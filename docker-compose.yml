name: clinic-hub-5s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - clinic_internal
      # Postgres nam tren ca hai mang. Day la diem duy nhat hai the gioi
      # gap nhau, va o do phan quyen database la thu quyet dinh.
      - finance_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - clinic_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  uploads-init:
    image: alpine:3.22
    restart: "no"
    command: ["sh", "-c", "chown -R 1000:1000 /data/uploads && chmod 750 /data/uploads"]
    volumes:
      - uploads_data:/data/uploads

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      # Chi cap dung nhung bien ma ma nguon thuc su doc, lay tu
      # grep process.env trong apps/backend/src. Truoc day cho ca .env.vps vao
      # bang env_file, nghia la container nay cam luon POSTGRES_PASSWORD, tuc
      # mat khau superuser. Ai chiem duoc backend la doc duoc so ke toan, du
      # migration 024 da chan tai khoan cua backend. Bit lo do.
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      ATTENDANCE_GRACE_MINUTES: ${ATTENDANCE_GRACE_MINUTES:-}
      BACKEND_PORT: ${BACKEND_PORT:-4000}
      BACKUP_BATCH_SIZE: ${BACKUP_BATCH_SIZE:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VPS_BOOTSTRAP_ADMIN_IDENTIFIER: ${VPS_BOOTSTRAP_ADMIN_IDENTIFIER:-}
      VPS_BOOTSTRAP_ADMIN_PASSWORD: ${VPS_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Tai khoan van hanh KHONG phai superuser. Superuser bo qua moi grant
      # va revoke, nen de backend chay bang superuser thi buc tuong quanh
      # schema finance khong con y nghia. Xem migration 024.
      DATABASE_URL: postgresql://${BACKEND_DB_USER:-${POSTGRES_USER}}:${BACKEND_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      APP_VERSION: ${APP_VERSION:-shadow}
      UPLOAD_DIR: /data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      uploads-init:
        condition: service_completed_successfully
    expose:
      - "4000"
    volumes:
      - uploads_data:/data/uploads
    networks:
      - clinic_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env.vps
    environment:
      # migrate GIU superuser vi no la service duy nhat chay DDL.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["node", "apps/backend/dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
    networks:
      - clinic_internal

  shadow-sync:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    profiles: ["migration"]
    environment:
      # Chi cap dung nhung bien ma ma nguon thuc su doc, lay tu
      # grep process.env trong apps/backend/src. Truoc day cho ca .env.vps vao
      # bang env_file, nghia la container nay cam luon POSTGRES_PASSWORD, tuc
      # mat khau superuser. Ai chiem duoc backend la doc duoc so ke toan, du
      # migration 024 da chan tai khoan cua backend. Bit lo do.
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      ATTENDANCE_GRACE_MINUTES: ${ATTENDANCE_GRACE_MINUTES:-}
      BACKEND_PORT: ${BACKEND_PORT:-4000}
      BACKUP_BATCH_SIZE: ${BACKUP_BATCH_SIZE:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VPS_BOOTSTRAP_ADMIN_IDENTIFIER: ${VPS_BOOTSTRAP_ADMIN_IDENTIFIER:-}
      VPS_BOOTSTRAP_ADMIN_PASSWORD: ${VPS_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Tai khoan van hanh KHONG phai superuser. Superuser bo qua moi grant
      # va revoke, nen de backend chay bang superuser thi buc tuong quanh
      # schema finance khong con y nghia. Xem migration 024.
      DATABASE_URL: postgresql://${BACKEND_DB_USER:-${POSTGRES_USER}}:${BACKEND_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-900}
    command:
      - sh
      - -c
      - >-
        while true; do
          node apps/backend/dist/import.js || true;
          sleep "$${SYNC_INTERVAL_SECONDS}";
        done
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # This service is a recurring worker, not an HTTP server. Disable the
    # backend image healthcheck so Docker does not report a false failure.
    healthcheck:
      disable: true
    networks:
      - clinic_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup-sync:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      # Chi cap dung nhung bien ma ma nguon thuc su doc, lay tu
      # grep process.env trong apps/backend/src. Truoc day cho ca .env.vps vao
      # bang env_file, nghia la container nay cam luon POSTGRES_PASSWORD, tuc
      # mat khau superuser. Ai chiem duoc backend la doc duoc so ke toan, du
      # migration 024 da chan tai khoan cua backend. Bit lo do.
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      ATTENDANCE_GRACE_MINUTES: ${ATTENDANCE_GRACE_MINUTES:-}
      BACKEND_PORT: ${BACKEND_PORT:-4000}
      BACKUP_BATCH_SIZE: ${BACKUP_BATCH_SIZE:-50}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-30}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VPS_BOOTSTRAP_ADMIN_IDENTIFIER: ${VPS_BOOTSTRAP_ADMIN_IDENTIFIER:-}
      VPS_BOOTSTRAP_ADMIN_PASSWORD: ${VPS_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Tai khoan van hanh KHONG phai superuser. Superuser bo qua moi grant
      # va revoke, nen de backend chay bang superuser thi buc tuong quanh
      # schema finance khong con y nghia. Xem migration 024.
      DATABASE_URL: postgresql://${BACKEND_DB_USER:-${POSTGRES_USER}}:${BACKEND_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB}
    command: ["node", "apps/backend/dist/backup.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    networks:
      - clinic_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    profiles: ["legacy"]
    env_file:
      - .env.vps
    expose:
      - "3000"
    networks:
      - clinic_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_DATA_BACKEND: ${VITE_DATA_BACKEND:-vps}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - clinic_internal
      - finance_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["node", "server/scheduler.mjs"]
    restart: unless-stopped
    profiles: ["legacy"]
    env_file:
      - .env.vps
    environment:
      INTERNAL_API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - clinic_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ───────────────────────────────────────────────────────────────────────
  # FINANCE VAULT
  # Container rieng, tai khoan database rieng, khoa ky phien rieng, mang
  # rieng. Backend van hanh khong nam tren mang finance_internal nen no
  # khong goi duoc dich vu nay, va tai khoan database cua no cung khong
  # doc duoc schema finance. Hai lop, doc lap nhau.
  # ───────────────────────────────────────────────────────────────────────
  finance:
    build:
      context: .
      dockerfile: apps/finance/Dockerfile
    restart: unless-stopped
    # Khong dung env_file. Ket tien chi duoc biet dung hai bi mat cua chinh no.
    environment:
      FINANCE_DATABASE_URL: postgresql://finance_app:${FINANCE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FINANCE_JWT_SECRET: ${FINANCE_JWT_SECRET}
      FINANCE_PORT: 4100
      FINANCE_BASE_PATH: /vault
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "4100"
    networks:
      - finance_internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/vault/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  clinic_internal:
    driver: bridge
  finance_internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  uploads_data:
