name: clinic-hub-5s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - clinic_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - clinic_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env.vps
    environment:
      # Tai khoan van hanh KHONG phai superuser. Superuser bo qua moi grant
      # va revoke, nen de backend chay bang superuser thi buc tuong quanh
      # schema finance khong con y nghia. Xem migration 024.
      DATABASE_URL: postgresql://${BACKEND_DB_USER:-${POSTGRES_USER}}:${BACKEND_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      APP_VERSION: ${APP_VERSION:-shadow}
      UPLOAD_DIR: /data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "4000"
    volumes:
      - uploads_data:/data/uploads
    networks:
      - clinic_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env.vps
    environment:
      # migrate GIU superuser vi no la service duy nhat chay DDL.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["node", "apps/backend/dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
    networks:
      - clinic_internal

  shadow-sync:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    profiles: ["migration"]
    env_file:
      - .env.vps
    environment:
      # Tai khoan van hanh KHONG phai superuser. Superuser bo qua moi grant
      # va revoke, nen de backend chay bang superuser thi buc tuong quanh
      # schema finance khong con y nghia. Xem migration 024.
      DATABASE_URL: postgresql://${BACKEND_DB_USER:-${POSTGRES_USER}}:${BACKEND_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-900}
    command:
      - sh
      - -c
      - >-
        while true; do
          node apps/backend/dist/import.js || true;
          sleep "$${SYNC_INTERVAL_SECONDS}";
        done
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # This service is a recurring worker, not an HTTP server. Disable the
    # backend image healthcheck so Docker does not report a false failure.
    healthcheck:
      disable: true
    networks:
      - clinic_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup-sync:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env.vps
    environment:
      # Tai khoan van hanh KHONG phai superuser. Superuser bo qua moi grant
      # va revoke, nen de backend chay bang superuser thi buc tuong quanh
      # schema finance khong con y nghia. Xem migration 024.
      DATABASE_URL: postgresql://${BACKEND_DB_USER:-${POSTGRES_USER}}:${BACKEND_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-30}
      BACKUP_BATCH_SIZE: ${BACKUP_BATCH_SIZE:-50}
    command: ["node", "apps/backend/dist/backup.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    networks:
      - clinic_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    profiles: ["legacy"]
    env_file:
      - .env.vps
    expose:
      - "3000"
    networks:
      - clinic_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_DATA_BACKEND: ${VITE_DATA_BACKEND:-vps}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - clinic_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["node", "server/scheduler.mjs"]
    restart: unless-stopped
    profiles: ["legacy"]
    env_file:
      - .env.vps
    environment:
      INTERNAL_API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - clinic_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  clinic_internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  uploads_data:
