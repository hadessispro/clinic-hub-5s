# ═══════════════════════════════════════════════════════════════════════════
# THEO DÕI HỆ THỐNG
# ═══════════════════════════════════════════════════════════════════════════
#
# Sinh một báo cáo đầy đủ vào phần tóm tắt của lần chạy, nơi GitHub tự dựng
# thành bảng. Mở tab Actions là đọc được, không cần vào VPS, không cần biết
# lệnh nào.
#
# Chạy tự động mỗi sáng 08:00 giờ Việt Nam, và bấm được bất cứ lúc nào.
#
# ─────────────────────────────────────────────────────────────────────────────
# BÁO CÁO TRẢ LỜI BA CÂU
# ─────────────────────────────────────────────────────────────────────────────
#
#   Hệ thống có đang sống không     dịch vụ, độ trễ từng đường, tài nguyên
#   Luồng nghiệp vụ chạy ra sao     lead vào, PG chấm công, kế toán ghi sổ,
#                                   theo từng ngày trong bảy ngày gần nhất
#   Chức năng nào đang được dùng    màn nào mở bao nhiêu lần, mấy người dùng
#
# Câu thứ ba là câu ít hệ thống nào trả lời được mà lại quyết định nhiều nhất
# khi chọn làm tiếp cái gì. Một màn hình dựng công phu mà ba tuần không ai mở
# thì đó là công đổ đi, và chỉ số liệu mới nói ra điều đó.
#
# Báo cáo CHỈ ĐỌC. Nó không sửa gì trên VPS, nên chạy bao nhiêu lần cũng được.

name: Theo dõi hệ thống

on:
  schedule:
    # 01:00 UTC là 08:00 giờ Việt Nam. GitHub chạy theo UTC, không theo múi
    # giờ của kho mã, nên phải tự quy đổi.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theo-doi
  cancel-in-progress: true

jobs:
  bao-cao:
    name: Sinh báo cáo tình trạng
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chuẩn bị khóa SSH
        env:
          KHOA: ${{ secrets.VPS_SSH_KEY }}
          BIET_TRUOC: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$KHOA" ] || [ -z "$BIET_TRUOC" ]; then
            echo "::error::Thiếu secret VPS_SSH_KEY hoặc VPS_KNOWN_HOSTS."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KHOA" > ~/.ssh/vps && chmod 600 ~/.ssh/vps
          printf '%s\n' "$BIET_TRUOC" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Sinh báo cáo
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_KEY: /home/runner/.ssh/vps
        run: |
          chmod +x scripts/bao-cao-he-thong.sh
          ./scripts/bao-cao-he-thong.sh | tee /tmp/bao-cao.md
          cat /tmp/bao-cao.md >> "$GITHUB_STEP_SUMMARY"
      - name: Bất biến kế toán trên dữ liệu production
        # Báo cáo ở bước trên đã kiểm sổ có cân không, nhưng chỉ kiểm TỔNG.
        # Tổng cân mà từng chứng từ không cân là chuyện có thật và đang xảy ra:
        # hai chứng từ lệch ngược chiều nhau thì tổng vẫn bằng 0. Bước này chạy
        # cả 12 bất biến, trong đó có phép kiểm từng chứng từ một.
        #
        # CHỈ ĐỌC. Gửi file SQL qua stdin nên không để lại gì trên VPS.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/vps -o BatchMode=yes "$VPS_HOST" \
            "cd /opt/clinic-hub-5s && docker compose --env-file .env.vps exec -T postgres \
               sh -c 'psql -U \$POSTGRES_USER -d \$POSTGRES_DB'" \
            < infra/postgres/kiem-thu/bat-bien-du-lieu.sql > /tmp/bb.txt 2>&1 || true

          {
            echo ''
            echo '## Bất biến kế toán trên dữ liệu'
            echo ''
            echo '```'
            sed -n '/BẤT BIẾN KẾ TOÁN/,/rows)/p' /tmp/bb.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          dong="$(grep -o '<!-- MAY-DOC bat-bien .* -->' /tmp/bb.txt | head -1)"
          if [ -z "$dong" ]; then
            echo "::error::Không chạy được bất biến trên production. Xem đầu ra:"
            tail -20 /tmp/bb.txt
            exit 1
          fi
          echo "$dong"

          # Bánh cóc. Đỏ khi số ca sai VƯỢT mức nợ đã ghi nhận, nhắc hạ mức khi
          # nó THẤP HƠN. Nợ chỉ giảm được. Xem infra/postgres/kiem-thu/.no-du-lieu
          # để biết vì sao từng khoản nợ còn đó.
          loi=0
          for cap in $(echo "$dong" | grep -oE '[0-9]+=[0-9]+'); do
            stt="${cap%%=*}"; nay="${cap##*=}"
            cho="$(grep -oE "^$stt=[0-9]+" infra/postgres/kiem-thu/.no-du-lieu | cut -d= -f2)"
            cho="${cho:-0}"
            if [ "$nay" -gt "$cho" ]; then
              echo "::error::Bất biến $stt: $nay ca sai, vượt mức đã ghi nhận là $cho. Hôm nay có gì đó mới hỏng."
              loi=1
            elif [ "$nay" -lt "$cho" ]; then
              echo "::notice::Bất biến $stt: còn $nay ca sai, đã giảm từ $cho. Hạ mức trong .no-du-lieu xuống $nay."
            fi
          done
          [ "$loi" = "0" ] && echo "Không có bất biến dữ liệu nào xấu đi." || exit 1



      - name: Báo động nếu có dấu hiệu hỏng
        # Đọc đúng một dòng máy đọc được ở cuối báo cáo, không bóc tách bảng
        # Markdown. Bóc tách bảng là cách dễ nhầm: dấu đỏ còn xuất hiện ở mục
        # đăng nhập thất bại, vốn là chuyện bình thường của mọi hệ thống.
        run: |
          dong="$(grep -o '<!-- MAY-DOC .* -->' /tmp/bao-cao.md | head -1)"
          if [ -z "$dong" ]; then
            echo "::error::Báo cáo không có dòng MAY-DOC. Script hỏng giữa chừng."
            exit 1
          fi
          echo "$dong"
          doc() { echo "$dong" | grep -o "$1=[0-9]*" | cut -d= -f2; }

          hong="$(doc dich_vu_hong)"
          lead="$(doc lead_hom_qua)"
          can="$(doc so_can)"
          chet="$(doc sao_luu_chet)"

          loi=0

          if [ "${can:-0}" != "1" ]; then
            echo "::error::SỔ KẾ TOÁN KHÔNG CÂN. Đây là lỗi nghiêm trọng nhất của phân hệ tài chính."
            loi=1
          fi

          if [ "${hong:-0}" != "0" ]; then
            echo "::error::$hong dịch vụ hoặc đường vào không đạt. Xem phần 1 của báo cáo."
            loi=1
          fi

          # Lead về 0 cả ngày nghĩa là luồng marketing đứng. Bảy ngày gần nhất
          # thấp nhất là 54, nên 0 là bất thường rõ ràng chứ không phải ngày ế.
          if [ "${lead:-1}" = "0" ]; then
            echo "::warning::Hôm qua không có lead mới nào. Kiểm tra luồng marketing."
          fi

          # Ngăn thư chết phình thêm nghĩa là lược đồ Supabase vẫn chưa được sửa.
          if [ "${chet:-0}" -gt 2000 ]; then
            echo "::warning::Hàng đợi sao lưu đã bỏ cuộc $chet bản ghi. Cần sửa lược đồ Supabase."
          fi

          [ "$loi" = "0" ] && echo "Không có dấu hiệu bất thường." || exit 1

      - name: Dọn khóa
        if: always()
        run: rm -f ~/.ssh/vps
