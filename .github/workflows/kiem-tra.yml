# ═══════════════════════════════════════════════════════════════════════════
# KIỂM TRA · chạy trên mọi lần đẩy mã và mọi pull request
# ═══════════════════════════════════════════════════════════════════════════
#
# Bốn việc kiểm ở đây đều bắt được lỗi ĐÃ THỰC SỰ xảy ra trong dự án này, chứ
# không phải lỗi giả định:
#
#   cu-phap    src/views/incidents.js từng thiếu import DEPARTMENTS và lỗi đó
#              lên tới production. Đây là loại lỗi máy bắt trong ba giây.
#
#   migration  Migration 022 tham chiếu cột work_date không tồn tại, và 008
#              từng drop rồi add lại ràng buộc trên bảng Lead đang lớn dần.
#              Chạy toàn bộ migration lên một database TRỐNG, rồi chạy LẦN HAI
#              để chứng minh chạy lại được mà không hỏng.
#
#   an-toan    Quy tắc 9 của dự án cấm commit .env, khóa riêng, dump database,
#              dữ liệu khách hàng. Hiện chỉ có .gitignore canh, mà .gitignore
#              thì gõ thêm git add -f là qua được.
#
#   dựng ảnh   Dựng đúng ba image mà production chạy. Kiểm cùng lúc pnpm
#              lockfile còn khớp, TypeScript biên dịch được, và vite dựng
#              được PWA. Mô phỏng bằng lệnh npm rời rạc thì chứng minh một
#              chuyện không ai quan tâm: lần chạy đầu của CI này hỏng đúng vì
#              dùng npm ci trong khi production dùng pnpm workspace.
#
# Repo đang công khai nên chỉ chạy trên runner của GitHub. Runner tự đặt trên
# repo công khai là lỗ hổng: ai fork cũng mở được pull request chứa workflow
# tùy ý và mã đó chạy trên máy mình.

name: Kiểm tra

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Đẩy liên tiếp lên cùng một nhánh thì hủy lượt cũ, đỡ xếp hàng.
  group: kiem-tra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cu-phap:
    name: Cú pháp và dựng được image thật
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cú pháp mọi file JavaScript
        # Rẻ và nhanh, chạy trước để hỏng cú pháp thì biết ngay thay vì đợi
        # hết một lượt build Docker.
        run: |
          loi=0
          n=0
          while IFS= read -r f; do
            n=$((n+1))
            node --check "$f" || { echo "::error file=$f::Lỗi cú pháp"; loi=1; }
          done < <(find src apps/finance/src apps/finance/public scripts \
                     -name '*.js' -not -path '*/node_modules/*' 2>/dev/null)
          while IFS= read -r f; do
            n=$((n+1))
            node --check "$f" || { echo "::error file=$f::Lỗi cú pháp"; loi=1; }
          done < <(find . -name '*.mjs' -not -path '*/node_modules/*' 2>/dev/null)
          echo "Đã kiểm $n file"
          exit $loi
      - name: Menu và quyền phải khớp nhau
        # Thêm view vào danh sách quyền mà quên thêm vào danh sách menu thì
        # quyền có cho phép cũng không hiện ra. View vẫn vào được nếu gõ thẳng
        # đường dẫn nên nó không hỏng theo cách dễ thấy — nó chỉ vô hình.
        #
        # Đã xảy ra thật ngày 28/08/2026 với màn Duyệt hoa hồng: cấp quyền cho
        # sáu vai trò, triển khai lên production, và không ai tìm thấy nó.
        run: node scripts/kiem-menu.mjs



      - name: Cú pháp mọi script bash
        run: |
          loi=0
          for f in scripts/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || { echo "::error file=$f::Lỗi cú pháp"; loi=1; }
          done
          exit $loi

      - name: Dựng đúng ba image mà production chạy
        # Dựng image THẬT thay vì chạy npm ci hay tsc rời rạc.
        #
        # Lần chạy đầu của CI này dùng "npm ci" trong apps/backend và hỏng, vì
        # hai lý do mà chỉ nhìn thấy khi đọc Dockerfile: apps/backend không có
        # package-lock.json, và production không dùng npm mà dùng pnpm với
        # workspace. Một phép kiểm mô phỏng cách build khác với cách build thật
        # thì nó chứng minh một chuyện không ai quan tâm.
        #
        # Dựng image thật kiểm cùng lúc: pnpm lockfile còn khớp, TypeScript
        # biên dịch được, vite dựng được PWA, và npm install của két kế toán
        # chạy được. Đúng những gì sẽ xảy ra khi triển khai.
        env:
          VITE_SUPABASE_URL: https://kiem-tra.local
          VITE_SUPABASE_PUBLISHABLE_KEY: kiem-tra
          VITE_SUPABASE_ANON_KEY: kiem-tra
          VITE_DATA_BACKEND: vps
        run: |
          loi=0
          for s in backend finance web; do
            echo "── dựng $s"
            docker compose build "$s" || { echo "::error::Không dựng được image $s"; loi=1; }
          done
          exit $loi


  migration:
    name: Lược đồ và dữ liệu kế toán
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kiem_tra
          POSTGRES_USER: kiem_tra
          POSTGRES_PASSWORD: kiem_tra
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kiem_tra"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: kiem_tra
      PGHOST: localhost
      PGUSER: kiem_tra
      PGDATABASE: kiem_tra
    steps:
      - uses: actions/checkout@v4

      - name: Quy ước migration
        # Chạy trước mọi thứ vì nó không cần database và vì nó chặn loại lỗi
        # đắt nhất: một migration xóa cột. Nút Khôi phục lùi được mã nguồn chứ
        # không lùi được lược đồ, nên cột đã xóa là mất hẳn.
        run: bash infra/postgres/kiem-thu/quy-uoc.sh

      - name: Chạy script khởi tạo trước
        # Trên máy thật, thư mục infra/postgres/init được nạp qua
        # docker-entrypoint-initdb.d ngay khi container Postgres sinh ra lần
        # đầu, nên migration mặc nhiên coi nó đã chạy. Migration 002 đọc bảng
        # migration.raw_records do 001-shadow.sql tạo. Bỏ bước này thì
        # migration 002 hỏng ngay, và đó chính là điều CI phát hiện ra lần
        # chạy đầu tiên.
        run: |
          set -e
          for f in $(ls infra/postgres/init/*.sql | sort); do
            echo "── init $(basename "$f")"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Áp migration ĐÚNG cách trình chạy thật áp
        # Không dùng psql -f.
        #
        # apps/backend/src/migrate.ts gọi client.query(sql) MỘT LẦN cho cả
        # file, bọc trong begin/commit. psql -f thì tách từng câu và tự commit
        # sau mỗi câu. Hai đường khác nhau, và cái khác nhau đó giấu được lỗi
        # thật: CREATE INDEX CONCURRENTLY chạy ngon dưới psql -f nhưng chết
        # dưới trình chạy thật vì nó nằm trong transaction.
        #
        # psql -c với chuỗi nhiều câu gửi cả chuỗi trong một lệnh, bọc trong
        # một transaction ngầm. Đúng bằng đường production đi.
        run: |
          set -e
          n=0
          for f in $(ls infra/postgres/migrations/*.sql | sort); do
            psql -v ON_ERROR_STOP=1 -q -c "$(cat "$f")" \
              || { echo "::error file=$f::Không áp được dưới trình chạy thật"; exit 1; }
            n=$((n+1))
          done
          echo "Đã áp $n migration"

      - name: Áp lại lần hai để chứng minh chạy lại được
        # Migration phải an toàn khi chạy lại, vì thực tế nó sẽ chạy lại: mỗi
        # lần dựng lại container migrate là một lần cả thư mục được áp lại.
        # Migration 008 từng drop rồi add ràng buộc, chạy lần hai là hỏng.
        run: |
          set -e
          for f in $(ls infra/postgres/migrations/*.sql | sort); do
            psql -v ON_ERROR_STOP=1 -q -c "$(cat "$f")" \
              || { echo "::error file=$f::Chạy lần hai bị lỗi, không an toàn khi chạy lại"; exit 1; }
          done
          echo "Toàn bộ migration chạy lại được"

      - name: Nạp một tháng sổ sách thu nhỏ
        # Bất biến dữ liệu chạy trên lược đồ trống thì mọi tổng đều bằng 0 và
        # mọi phép thử đều đạt một cách vô nghĩa: 0 = 0. Phải có dữ liệu thì
        # phép thử mới nói được điều gì.
        run: psql -v ON_ERROR_STOP=1 -q -f infra/postgres/kiem-thu/du-lieu-mau.sql

      - name: Bất biến của dữ liệu
        # Khác phép thử lược đồ ở trên. Cái kia hỏi "cái khóa còn hoạt động
        # không". Cái này hỏi "thứ đang nằm trong sổ có đúng không".
        run: psql -v ON_ERROR_STOP=1 -f infra/postgres/kiem-thu/bat-bien-du-lieu.sql

      - name: Thử ngược · bắt bộ kiểm phải thất bại theo yêu cầu
        # Bước quan trọng nhất của job này.
        #
        # Một phép thử chỉ từng nhìn thấy dữ liệu sạch là một phép thử có thể
        # đã hỏng từ lâu mà không ai biết. Nó xanh mọi lần chạy, và nó cũng sẽ
        # xanh đúng cái ngày sổ sách lệch thật. Bước này cố tình gây ra từng
        # loại sai một, rồi đòi bộ kiểm đỏ đúng chỗ, rồi hoàn tác.
        run: bash infra/postgres/kiem-thu/thu-nguoc.sh
      - name: Hoa hồng tính ra đúng số chưa
        # Khác bước dưới. Bước dưới hỏi "database có chặn sai không"; bước này
        # hỏi câu khó hơn: "khi không có gì sai, nó có tính RA ĐÚNG SỐ không".
        #
        # Mười hai trường hợp phủ từng nhánh phân loại, gồm cả hai biên đúng
        # ngày thứ 10 và ngày thứ 14 — biên là chỗ sai nhiều nhất và cũng là
        # chỗ tranh cãi nhiều nhất khi trả tiền.
        run: psql -v ON_ERROR_STOP=1 -f infra/postgres/kiem-thu/hoa-hong-tinh-thu.sql



      - name: Chốt chặn hoa hồng PG/SUP
        # Tiền thật trả cho người thật, nên tám chốt chặn của nó đều bị cố tình
        # vi phạm ở đây và phải bị database từ chối: nhảy bước duyệt, một người
        # ký cả hai vòng, trả trùng một lead qua hai đợt, sửa số sau khi chốt.
        #
        # Một ràng buộc chưa từng bị thử là ràng buộc không ai biết còn sống
        # hay không. Nó có thể đã chết vì một migration sau đó, và mọi thứ vẫn
        # xanh cho tới ngày trả nhầm tiền.
        run: psql -v ON_ERROR_STOP=1 -f infra/postgres/kiem-thu/hoa-hong-thu-nguoc.sql



      - name: Bất biến của lược đồ
        # Chạy SAU phần dữ liệu, không phải trước.
        #
        # File này chèn dữ liệu thử để bắt database chặn: một tài khoản 999,
        # một kỳ 2000-01, và một chứng từ THU001 không có dòng bút toán nào.
        # Chứng từ rỗng đó chính là thứ bất biến dữ liệu số 5 đi tìm. Chạy
        # trước thì phần dữ liệu đỏ vì rác của phần lược đồ, và mất cả buổi
        # để hiểu vì sao.
        # Chèn thử dòng sai rồi xem database có chặn không: ghi cả hai vế, sửa
        # nhật ký truy cập, tự nâng quyền, ghi vào kỳ đã khóa.
        run: |
          set -e
          psql -v ON_ERROR_STOP=1 -f infra/postgres/kiem-thu/bat-bien.sql 2>&1 | tee /tmp/kq.txt
          if grep -q 'HONG' /tmp/kq.txt; then
            echo "::error::Có bất biến lược đồ bị hỏng"; exit 1
          fi
          echo "Số phép thử đạt: $(grep -c 'OK ·' /tmp/kq.txt)"

  an-toan:
    name: Không lọt bí mật và dữ liệu khách hàng
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Chặn loại file cấm commit
        # Quy tắc 9 của dự án. Kiểm trên TOÀN BỘ lịch sử chứ không chỉ bản
        # hiện tại: repo công khai thì mọi thứ từng commit đều còn đọc được,
        # xóa ở bản mới không lấy lại được gì.
        run: |
          cam='[.]env$|[.]env[.]|[.]pem$|[.]key$|id_rsa|id_ed25519|[.]sql[.]gz$|[.]dump$|[.]xlsx?$|[.]xlsm$'
          giu='[.]env[.]example$'
          lot=$(git log --all --pretty=format: --name-only --diff-filter=A \
                | sort -u | grep -E "$cam" | grep -vE "$giu" || true)
          if [ -n "$lot" ]; then
            echo "::error::Có file thuộc loại cấm trong lịch sử git:"
            echo "$lot"
            exit 1
          fi
          echo "Không có file cấm nào trong lịch sử"

      - name: Chặn chuỗi giống bí mật thật
        # Ba điều chỉnh, cả ba đều rút từ lần chạy đầu tiên của CI này:
        #
        #   Chỉ quét file GIT ĐANG THEO DÕI. File .env thật nằm trên máy lập
        #   trình viên, đã bị .gitignore chặn và chưa từng rời khỏi máy đó.
        #   Quét cả nó chỉ tạo báo động về một thứ không ai thấy được.
        #
        #   Bỏ qua mọi file .example. Cả công dụng của chúng là chứa chỗ điền
        #   mẫu, mà chỗ điền mẫu thì trông y hệt bí mật thật với mọi biểu thức
        #   tìm kiếm. Lần chạy đầu đã báo động vì đúng chỗ đó.
        #
        #   Bỏ qua chính file workflow này, vì nó chứa các mẫu tìm kiếm và sẽ
        #   tự bắt được chính mình.
        #
        # Một cảnh báo sai lặp lại là cách nhanh nhất khiến người ta tắt cảnh
        # báo đi, và lúc đó cảnh báo thật cũng mất theo.
        run: |
          mau='(POSTGRES_PASSWORD|APP_JWT_SECRET|FINANCE_JWT_SECRET|SERVICE_ROLE_KEY|SECRET_KEY|BACKEND_DB_PASSWORD|FINANCE_DB_PASSWORD)[[:space:]]*[:=][[:space:]]*['"'"'"]?[A-Za-z0-9+/=_-]{20,}'
          lot=$(git ls-files -z \
                | grep -zZvE '[.]example$|^[.]github/workflows/' \
                | xargs -0 grep -InE "$mau" 2>/dev/null \
                | grep -v '[$]{' || true)
          if [ -n "$lot" ]; then
            echo "::error::Có chuỗi giống bí mật thật trong file đã commit:"
            echo "$lot" | cut -c1-160
            exit 1
          fi
          echo "Không thấy bí mật nào trong file đã commit"

      - name: Chặn khóa riêng
        # Mẫu tìm ghép từ hai mảnh để chuỗi hoàn chỉnh không bao giờ xuất hiện
        # nguyên vẹn trong file này. Viết thẳng ra thì phép quét bắt được chính
        # file workflow, và CI đỏ vì đúng cái nó dùng để kiểm.
        run: |
          mau="BEGIN [A-Z ]*PRIVATE"" KEY"
          lot=$(git ls-files -z \
                | grep -zZvE '^[.]github/workflows/' \
                | xargs -0 grep -lE "$mau" 2>/dev/null || true)
          if [ -n "$lot" ]; then
            echo "::error::Có khóa riêng trong repo:"; echo "$lot"; exit 1
          fi
          echo "Không có khóa riêng"


  ket-luan:
    name: Tổng kết
    runs-on: ubuntu-latest
    needs: [cu-phap, migration, an-toan]
    if: always()
    steps:
      - name: Chốt kết quả
        run: |
          echo "cú pháp   : ${{ needs.cu-phap.result }}"
          echo "migration : ${{ needs.migration.result }}"
          echo "an toàn   : ${{ needs.an-toan.result }}"
          if [ "${{ needs.cu-phap.result }}" != "success" ] \
          || [ "${{ needs.migration.result }}" != "success" ] \
          || [ "${{ needs.an-toan.result }}" != "success" ]; then
            echo "::error::Chưa đạt. Không được triển khai commit này."
            exit 1
          fi
          echo "Đạt cả ba. Commit này đủ điều kiện triển khai."
